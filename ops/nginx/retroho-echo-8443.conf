# Preserve the existing browser endpoint; keep Echo and its HTTP API local.
# Install under /etc/nginx/conf.d only after setting Echo to 127.0.0.1:6001 HTTP.
map $http_upgrade $retroho_echo_connection {
    default upgrade;
    ''      close;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name retroho.com;

    ssl_certificate /etc/letsencrypt/live/retroho.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/retroho.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log off;
    client_max_body_size 1m;

    location /socket.io/ {
        proxy_pass http://127.0.0.1:6001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $retroho_echo_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
    }

    # Do not expose Echo's management/broadcast API through the public listener.
    location / {
        return 404;
    }
}
